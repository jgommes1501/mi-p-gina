<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Cabecera -->
  <header></header>

  <!-- Galería principal -->
  <section class="galeria">
    <img src="img/1.jpg" alt="Imagen 1">
    <img src="img/2.jpg" alt="Imagen 2">
    <img src="img/3.jpg" alt="Imagen 3">
  </section>

  <!-- Sección de contenido -->
  <section class="contenido">
    <img
      src="img/peq.webp"
      srcset="
        img/gra.webp 1024w,
        img/med.jpg 768w,
        img/peq.webp 480w"
      sizes="(max-width: 768px) 100vw, 50vw"
      alt="Imagen adaptativa">

    <p>Turismo en Japón: descubre los lugares más emblemáticos y la cultura única del país.</p>
  </section>

  <!-- Pie de página -->
  <footer>
    <a href="#" class="boton">Inicio</a>
  </footer>

</body>
</html>
