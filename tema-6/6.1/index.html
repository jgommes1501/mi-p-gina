<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Música</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Música de fondo</h1>

  <audio 
    id="reproductor"
    controls 
    loop 
    preload="metadata"
    aria-label="Reproductor de música de fondo"
    role="region">

      <source src="sounds/440.mp3" type="audio/mpeg">
      <source src="sounds/440.wav" type="audio/wav">

      Tu navegador no admite la etiqueta de audio.
  </audio>

</body>
</html>
