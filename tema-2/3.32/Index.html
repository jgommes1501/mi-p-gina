<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="static">
            <p>Position: static</p>
        </div>
        <div class="relative">
            <p>Position: relative</p>
        </div>
        <div class="absolute">
            <p>Position: absolute</p>
        </div>
        <div class="sticky">
            <p>Position: sticky</p>
        </div>
    </div>
    <div class="fixed">
        <p>Position: fixed</p>
    </div>
    <div style="height: 1200px;"></div>
</body>
</html>
